name: claude-review

# REVIEWER + FIX LOOP + STATUS, on every PR (drafts included), whatever the branch.
#
# Draft = signal for the human:
# - Draft             → an agent is working (review ↔ fix loop). Don't look yet.
# - Ready for review  → the human's turn (review says good, loop stopped, or review failed).
#
# Docs-only PRs (docs/, CONTEXT.md, README.md) skip the review: they get 5/5 and go ready in seconds.
#
# From AlfGoto/Behalf stacks/common.

env:
  OWNER_LOGIN: AlfGoto
  # Project-specific things the reviewer must check (from your CLAUDE.md hard rules). One per line.
  PROJECT_CHECKS: |
    - Names follow the glossary, never its "_Avoid_" words.
    - Architecture rules from docs/ (e.g. dependency direction, where code lives).
    - Security rules from CLAUDE.md (tokens, permissions, input sanitizing, no secrets in code).
    - No deploy: no deploy command or script added or run (wrangler deploy, cdk deploy, projalf deploy).
    - api/.github/workflows/ci-cd.yml comes from projalf: never edited by hand.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    # No paths-ignore on purpose: a skipped workflow would leave a docs-only PR in draft forever.
    # The `scope` step below skips the review instead.

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      mode: ${{ steps.loop.outputs.mode }}
      verdict: ${{ steps.review.outputs.structured_output && fromJSON(steps.review.outputs.structured_output).verdict || '' }}
      confidence: ${{ steps.review.outputs.structured_output && fromJSON(steps.review.outputs.structured_output).confidence || '' }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: read
      actions: read
    steps:
      # Docs-only PR? Then no review: pr-status gives it 5/5 and marks it ready.
      - id: scope
        name: Docs-only?
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files?per_page=100" --jq '.[].filename')
          other=$(grep -v -E '^(docs/|CONTEXT\.md$|README\.md$)' <<< "$files" || true)
          if [ -n "$files" ] && [ -z "$other" ]; then echo "docs_only=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.scope.outputs.docs_only != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Count past fix rounds (hidden marker in the relay's review comments).
      - id: loop
        name: Count fix rounds
        if: steps.scope.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          reviews=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews?per_page=100" --jq '[.[].body]')
          done=$(jq '[.[] | select(contains("<!-- autofix -->"))] | length' <<< "$reviews")
          stopped=$(jq '[.[] | select(contains("<!-- autofix-stopped -->"))] | length' <<< "$reviews")
          echo "round=$((done + 1))" >> "$GITHUB_OUTPUT"
          # After 3 rounds: post "loop stopped" once, then stay quiet on later pushes.
          if [ "$done" -lt 3 ]; then mode=on; elif [ "$stopped" -eq 0 ]; then mode=capped; else mode=off; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - id: review
        if: steps.scope.outputs.docs_only != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lets the review run again after the @claude agent pushes a fix.
          allowed_bots: "claude[bot]"
          additional_permissions: |
            actions: read
            checks: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You review a pull request. The PR branch is already checked out in the current directory.
            First read CLAUDE.md, docs/README.md and CONTEXT.md if they exist, then the docs/ files that matter for this diff.

            Check, in this order:
            0. No unapproved scope: list anything the PR adds that is NOT decided in docs/
               and NOT asked for by ${{ env.OWNER_LOGIN }} in the linked issue. Each one = "fix first": remove it or ask.
               Your own simplicity ideas are suggestions, never new scope.
            1. Matches the decisions in docs/ and these project checks:
            ${{ env.PROJECT_CHECKS }}
            2. Bugs.
            3. Security and abuse (exploits, client-side trust, missing auth checks).
            4. Tests: look at the PR's CI checks ONCE (`gh pr checks`, never `--watch`, never wait or poll:
               this runner is billed while it waits). Pending → write "CI still running". Red → "fix first".
               Important logic has a few simple tests. Feature first, tests second: flag test code that is too big,
               or code changed only to be testable. Missing tests on trivial code is NOT a reason for "fix first".
            5. docs/ (or the glossary) is updated if a decision or a term changed.
            6. Simplicity: is there a simpler way? List what is not needed for the PR's goal. Suggest the smaller version.
            7. PR body "How to test": step-by-step checkboxes, every command written out in full, each with the
               result to expect. Check each step against the code on this branch (commands, ids, messages exist). A wrong, missing or vague step = "fix first".

            How to write:
            - The human reads this fast. Verdict and must-fix items first, then the rest.
              Simple English, short sentences, lists, one idea per line. Bold the key point. No filler.
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for code issues.
            - ONE summary comment per PR, ending with "✅ good to merge" or "⚠️ fix first".
              Always write it with `gh pr comment --edit-last --create-if-none` (updates your old summary).

            Don't repeat yourself (this runs on every push):
            - First read what you already said: `gh pr view --comments` and
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
            - Never post an inline comment on an issue you already raised.
            - In the summary: mark old issues as fixed ✅ or still open, add only new ones.
            - Only post GitHub comments. Never approve, never merge.

            Verdict (structured output): "fix" only if something must change before merge; "good" otherwise.

            Confidence (structured output, 0 to 5): how sure you are the human can merge WITHOUT testing by hand.
            The workflow puts it in the PR title as a prefix ("4/5 ...").
            - 5: nothing user-facing changes, or trivial.
            - 4: small and isolated, covered by tests; the worst case is minor.
            - 3: tests pass, but the result depends on how it looks or feels, or it touches a shared system. Quick test advised.
            - 2: core flow, many edge cases, or a possible exploit. Test it.
            - 1: big or risky change.
            - 0: CI fails or it can't work as is.
            Verdict "fix" → confidence 2 at most. Write the score and one line why at the top of your summary.
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 60
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["good","fix"]},"confidence":{"type":"integer","minimum":0,"maximum":5}},"required":["verdict","confidence"]}'
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews:*),Bash(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments:*)"

      # Fix loop, step 2. The WORKFLOW decides from the verdict, not the model.
      # A second, tiny Claude step posts the request: it gets a fresh App token, so its comment
      # triggers claude.yml (GITHUB_TOKEN events never trigger workflows; the first step's token is revoked).
      - name: Ask @claude to fix (loop)
        if: >-
          steps.scope.outputs.docs_only != 'true' &&
          steps.loop.outputs.mode != 'off' &&
          steps.review.outputs.structured_output != '' &&
          fromJSON(steps.review.outputs.structured_output).verdict == 'fix'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          prompt: |
            Run exactly ONE shell command, copied character for character, then stop. Do nothing else.
            ${{ steps.loop.outputs.mode == 'on' && format('gh pr review {0} --comment --body "@claude please fix the open review comments (round {1}/3). Fix what you agree with, then push. If you disagree with a comment, reply to it and leave that part. Nothing left to change? Do not push, just say so. <!-- autofix -->"', github.event.pull_request.number, steps.loop.outputs.round) || format('gh pr review {0} --comment --body "🛑 Review/fix loop stopped after 3 rounds. @{1} please take a look. <!-- autofix-stopped -->"', github.event.pull_request.number, env.OWNER_LOGIN) }}
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 3
            --allowedTools "Bash(gh pr review:*)"

  # Whose turn + confidence in the title. The WORKFLOW decides from the verdict.
  # Uses GITHUB_TOKEN, so the "ready_for_review" event it causes does NOT start a second review.
  pr-status:
    needs: review
    if: always() && needs.review.result != 'cancelled' && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          MODE: ${{ needs.review.outputs.mode }}
          # Docs-only PRs skip the review: 5/5, and an empty verdict marks them ready.
          CONFIDENCE: ${{ needs.review.outputs.docs_only == 'true' && '5' || needs.review.outputs.confidence }}
        run: |
          # Title prefix "N/5 ": how safe it is to merge without testing by hand.
          if [ -n "$CONFIDENCE" ]; then
            title=$(gh pr view "$PR" -R "$REPO" --json title --jq '.title')
            base=$(sed -E 's#^[0-5]/5 ##' <<< "$title")
            new="$CONFIDENCE/5 $base"
            if [ "$new" != "$title" ]; then gh pr edit "$PR" -R "$REPO" --title "$new"; fi
          fi
          is_draft=$(gh pr view "$PR" -R "$REPO" --json isDraft --jq '.isDraft')
          if [ "$VERDICT" = "fix" ] && [ "$MODE" = "on" ]; then
            # The agent is about to fix things: not the human's turn yet.
            if [ "$is_draft" = "false" ]; then gh pr ready "$PR" -R "$REPO" --undo; fi
          else
            # Good to merge, loop stopped, or the review failed: the human's turn.
            if [ "$is_draft" = "true" ]; then gh pr ready "$PR" -R "$REPO"; fi
          fi
